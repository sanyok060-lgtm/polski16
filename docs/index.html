<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Polski 16 — тренажёр польского по методу «Полиглот»</title>
<style>
/* Польские слова внутри русского текста автоматически набираются серифом:
   шрифт "PLMix" подключает локальные серифы только для латиницы (unicode-range). */
@font-face{font-family:"PLMix";src:local("Iowan Old Style"),local("IowanOldStyle-Roman"),local("Palatino"),local("Palatino Linotype"),local("Book Antiqua"),local("Georgia"),local("Noto Serif"),local("NotoSerif"),local("Droid Serif"),local("Liberation Serif"),local("DejaVu Serif"),local("Times New Roman");unicode-range:U+0041-005A,U+0061-007A,U+00C0-00FF,U+0100-017F;}
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface2:#e6e8ec; --text:#17181c; --muted:#646972; --border:#d5d8de;
  --accent:#3247b8; --accent-text:#ffffff; --accent-soft:rgba(50,71,184,.10);
  --green:#25904f; --green-soft:rgba(37,144,79,.13); --yellow:#c98d00; --yellow-soft:rgba(201,141,0,.16); --red:#cf3d33; --red-soft:rgba(207,61,51,.12);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pl:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif","Liberation Serif","Times New Roman",serif;
  --mix:"PLMix",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131418; --surface:#1d1f25; --surface2:#292c34; --text:#e9eaee; --muted:#9a9fab; --border:#3a3e48;
    --accent:#8d9dff; --accent-text:#0f1330; --accent-soft:rgba(141,157,255,.14);
    --green:#4fc57c; --green-soft:rgba(79,197,124,.16); --yellow:#e5b53a; --yellow-soft:rgba(229,181,58,.18); --red:#f0685c; --red-soft:rgba(240,104,92,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131418; --surface:#1d1f25; --surface2:#292c34; --text:#e9eaee; --muted:#9a9fab; --border:#3a3e48;
  --accent:#8d9dff; --accent-text:#0f1330; --accent-soft:rgba(141,157,255,.14);
  --green:#4fc57c; --green-soft:rgba(79,197,124,.16); --yellow:#e5b53a; --yellow-soft:rgba(229,181,58,.18); --red:#f0685c; --red-soft:rgba(240,104,92,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pl{font-family:var(--pl)}
#app{max-width:620px;margin:0 auto;padding:0 14px 48px}

/* шапка */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 8px}
.brand{font-family:var(--pl);font-size:22px;line-height:1.1}
.brand small{display:block;font-family:var(--ui);font-size:12px;color:var(--muted);margin-top:2px}
.topbtns{display:flex;gap:6px}
.topbtns button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:14px}
.topbtns button.icon{width:40px;padding:0;font-size:18px}

/* уроки и вкладки */
.lessons{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.lessons::-webkit-scrollbar{display:none}
.lessons button{flex:0 0 auto;min-width:42px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:500}
.lessons button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.lessonTitle{margin:2px 0 12px;font-size:15px;color:var(--muted);line-height:1.35}
.lessonTitle b{display:block;color:var(--text);font-weight:600;font-size:17px}
.lessonTitle span{font-family:var(--mix)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:500}
.tabs button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* счётчики и полоса */
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:0 0 10px}
.grade{font-size:36px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.grade small{font-size:12px;color:var(--muted);font-weight:400;margin-left:5px}
.sc{font-size:14px;color:var(--muted);white-space:nowrap}
.sc b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.sc.ok b{color:var(--green)} .sc.bad b{color:var(--red)}
.bar{display:flex;gap:3px;height:8px;margin:0 0 18px}
.bar i{display:block;flex:1;height:8px;min-width:0;margin:0;padding:0;border:0;border-radius:3px;background:var(--border);transition:background .2s}
.bar i.g{background:var(--green)} .bar i.y{background:var(--yellow)} .bar i.r{background:var(--red)}
.bar i.r.done{background:repeating-linear-gradient(-45deg,var(--red) 0 4px,var(--green) 4px 8px)}
.bar i.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}

/* фраза */
.prompt{padding:2px 0 16px}
.ru{font-size:23px;line-height:1.35;font-weight:500}
.ru .tag{color:var(--muted);font-weight:400;font-size:.8em}
.prompt .hint{font-size:13px;color:var(--muted);margin-top:4px}
.inputrow{display:flex;gap:6px;margin-bottom:8px}
.inputrow input{flex:1;min-width:0;height:52px;padding:0 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-family:var(--pl);font-size:21px}
.inputrow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inputrow input[readonly]{background:var(--surface2);color:var(--muted)}
.inputrow button{width:48px;height:52px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:18px;flex:0 0 auto}
.dia{display:flex;gap:5px;margin-bottom:12px}
.dia button{flex:1;min-width:0;height:42px;padding:0;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-family:var(--pl);font-size:20px}
.grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.grid button{padding:0 14px;height:44px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-family:var(--pl);font-size:20px;line-height:1}
.grid button.used{opacity:.35}
button:disabled{cursor:default}
button.primary{width:100%;height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font-size:17px;font-weight:600}
button.secondary{width:100%;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:16px}
.actions{display:grid;gap:8px}

/* результат */
.fb{margin-top:16px;padding:14px 14px 14px 16px;border-radius:14px;border-left:5px solid var(--border);background:var(--surface)}
.fb.g{border-color:var(--green)} .fb.y{border-color:var(--yellow)} .fb.r{border-color:var(--red)}
.fbhead{font-weight:600;margin-bottom:8px}
.fb.g .fbhead{color:var(--green)} .fb.y .fbhead{color:var(--yellow)} .fb.r .fbhead{color:var(--red)}
.ref{display:flex;align-items:center;gap:10px;font-family:var(--pl);font-size:23px;line-height:1.3;margin-bottom:6px}
.ref mark{background:var(--yellow-soft);color:inherit;box-shadow:inset 0 -2px 0 var(--yellow);border-radius:2px}
.ref2{font-size:14px;color:var(--muted);margin-bottom:6px}
.ref2 span{font-family:var(--pl);font-size:17px;color:var(--text)}
.tr{font-size:15px;color:var(--muted);margin:-2px 0 8px;letter-spacing:.01em}
.tr.wtr{margin:-4px 0 14px}
.ynote{font-size:14px;color:var(--yellow);margin-bottom:8px}
.note{font-family:var(--mix);font-size:15px;color:var(--muted);line-height:1.5;margin-bottom:14px}
.spk{width:38px;height:38px;flex:0 0 auto;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:17px;padding:0}

/* завершение */
.finish{margin-top:6px;padding:18px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.finish h3{margin:0 0 6px;font-size:20px}
.finish p{margin:0 0 14px;color:var(--muted)}
.finish p b{color:var(--text)}

/* слова */
.wprog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:10px}
.wcard{padding:6px 0 18px}
.wru{font-size:26px;font-weight:500;line-height:1.3}
.wru .tag{color:var(--muted);font-weight:400;font-size:.75em}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opts button{min-height:50px;padding:8px 14px;text-align:left;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--pl);font-size:20px;line-height:1.25}
.opts button .k{font-family:var(--ui);font-size:12px;color:var(--muted);margin-right:10px}
.opts button.ok{border-color:var(--green);background:var(--green-soft)}
.opts button.bad{border-color:var(--red);background:var(--red-soft)}
.opts button:disabled{opacity:1}
.wfb{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600}
.wfb.ok{color:var(--green)} .wfb.bad{color:var(--red)}

/* правило и таблицы */
.rule{font-family:var(--mix);font-size:16px;line-height:1.55}
.rule p,.overlay p{margin:0 0 12px}
.rule ul,.overlay ul{padding-left:20px;margin:0 0 12px}
.rule li,.overlay li{margin-bottom:6px}
.rule table,.overlay table{border-collapse:collapse;width:100%;margin:6px 0 16px;font-size:15px}
.rule td,.rule th,.overlay td,.overlay th{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.rule th,.overlay th{background:var(--surface2);font-weight:600;font-family:var(--mix)}
.rule .conv{font-size:14px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rule .secondary{margin-top:8px}

/* оверлей подсказки */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:12px 14px 40px;font-family:var(--mix);line-height:1.5}
.overlay[hidden]{display:none}
.overlay .inner{max-width:620px;margin:0 auto}
.overlay .bar2{position:sticky;top:0;display:flex;justify-content:flex-end;background:var(--bg);padding:4px 0 8px;z-index:1}
.overlay .bar2 button{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.overlay h2{font-size:22px;margin:4px 0 12px}
.overlay h3{font-size:17px;margin:20px 0 8px}
.overlay h4{font-size:15px;margin:12px 0 6px}
.overlay .small{font-size:14px;color:var(--muted)}
.overlay .alt{color:var(--muted);font-size:13px}
.overlay table.main td{vertical-align:top}

/* тост */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92vw;padding:10px 14px;border-radius:12px;background:var(--text);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}

@media (min-width:600px){
  .ru{font-size:25px}
  .grid button{height:42px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}

/* ===== v2: чипы, скрытая сетка, разбор, итог ===== */
.lessons .sep{flex:0 0 1px;background:var(--border);margin:6px 4px}
.lessons button.sit{padding:0 10px;font-size:14px}
.lessons button.spec{font-size:14px;color:var(--muted)}
.lessons button.spec b{color:var(--red);font-weight:600;margin-left:2px}
.lessons button.spec.active{color:var(--accent-text)} .lessons button.spec.active b{color:var(--accent-text)}
.tabs[hidden]{display:none}
.gridwrap{margin-bottom:16px}
.gridwrap .grid{margin-bottom:0}
button.ghost{width:100%;height:42px;border-radius:11px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:15px}
button.ghost:disabled{opacity:.5}
.origin{font-size:13px;color:var(--muted);margin-bottom:4px}
.diff{margin:4px 0 10px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.difflabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.diff .pl{font-size:19px;line-height:1.4}
.diff s{color:var(--red);text-decoration:line-through;opacity:.8}
.diff b{color:var(--green);font-weight:600}
.diffhint{font-size:14px;color:var(--text);margin-top:6px}
.actions.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
.actions.row button{font-size:15px}
button.primary:disabled{opacity:.45}
.sum h3{font-size:16px;margin:22px 0 8px}
.sumtop{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.sumtop .big{display:flex;flex-direction:column}
.sumtop .big .grade{font-size:44px}
.sumtop .big small{font-size:12px;color:var(--muted)}
.sumfacts{font-size:14px;color:var(--muted);line-height:1.6}
.sumfacts b{color:var(--text)}
.muted{color:var(--muted)} .small{font-size:13px}
.tags{display:grid;gap:8px}
.tagrow{display:grid;grid-template-columns:1fr 90px 44px;align-items:center;gap:10px;font-size:14px}
.tagname{font-family:var(--mix)}
.tagbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.tagbar i{display:block;height:100%;border-radius:4px}
.tagbar i.g{background:var(--green)} .tagbar i.y{background:var(--yellow)} .tagbar i.r{background:var(--red)}
.tagpct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.lessonlist{display:grid;gap:6px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);text-align:left;font-size:14px}
.lrow .lname{font-family:var(--mix);flex:1;min-width:0}
.lrow .lname em{font-style:normal;color:var(--green);font-size:12px;margin-left:4px}
.lrow .lstat{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto;font-variant-numeric:tabular-nums}
.lrow .lstat span{font-weight:600} .lrow .lstat span.g{color:var(--green)} .lrow .lstat span.y{color:var(--yellow)}
.lrow .lstat small{font-size:11px;color:var(--muted)}
.settings{display:grid;gap:12px;font-size:14px}
.settings label{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.settings input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
button.danger{color:var(--red);border-color:var(--red)}
@media (max-width:380px){.tagrow{grid-template-columns:1fr 70px 40px}}

</style>

<body>
<div id="app">
  <header class="top">
    <div class="brand">Polski 16<small>тренажёр по методу «Полиглот»</small></div>
    <div class="topbtns">
      <button type="button" id="btnSummary">Итог</button>
      <button type="button" id="btnRef">Подсказка</button>
      <button type="button" id="btnTheme" class="icon" aria-label="Переключить тему">◐</button>
    </div>
  </header>
  <nav class="lessons" id="lessonBar" aria-label="Уроки"></nav>
  <div class="lessonTitle" id="lessonTitle"></div>
  <nav class="tabs" aria-label="Режим">
    <button type="button" data-mode="phrases">Фразы</button>
    <button type="button" data-mode="words">Слова</button>
    <button type="button" data-mode="rule">Правило</button>
  </nav>
  <main id="panel"></main>
</div>
<div id="refOverlay" class="overlay" hidden role="dialog" aria-label="Опорные таблицы">
  <div class="inner"><div class="bar2"><button type="button" id="btnRefClose">Закрыть</button></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
var LESSONS=[];
/* ===== Темы (теги) для аналитики слабых мест ===== */
var TAGS={
 'conj-am':'Спряжение -am / -asz','conj-isz':'Спряжение -ę / -isz','conj-esz':'Спряжение -ę / -esz','byc':'Глагол być',
 'nie-gen':'Отрицание nie и родительный','gen':'Родительный после глаголов и предлогов','czy':'Вопрос с czy','qword':'Вопросительные слова',

 'acc':'Винительный падеж','pron':'Личные местоимения (go, ją, mnie…)','modal':'Модальные глаголы','instr':'Творительный падеж','loc':'Предложный падеж',

 'num':'Числительные и счёт','money':'Цены и деньги','time':'Время и даты','cond':'Условное наклонение','request':'Просьбы и вежливые формулы',

/* Теги фраз уроков 1–12 (по порядку предложений в уроке) */
var SENT_TAGS={
 1:[['conj-am','loc'],['conj-am'],['conj-am','acc'],['conj-am','acc'],['conj-am','pron'],['conj-am','instr'],['conj-am','gen'],['conj-am','gen'],['byc','loc'],['byc','loc'],['pan','conj-am']],

 4:[['nie-gen'],['nie-gen'],['nie-gen'],['nie-gen'],['nie-gen'],['nie-gen'],['nie-gen'],['nie-gen'],['nie-gen'],['nie-gen','acc'],['nie-gen'],['nie-gen','pan']],
 5:[['czy'],['czy'],['qword'],['qword'],['qword','byc'],['qword'],['qword','nie-gen'],['qword','money'],['qword','pan'],['qword','byc'],['qword','time'],['qword']],
 6:[['past','loc'],['past','loc'],['past','czy'],['past','acc'],['past-pl'],['past-pl'],['past'],['past','loc'],['past','pan'],['past-pl','nie-gen'],['past','acc'],['past']],
 7:[['future'],['future','byc'],['future','time'],['future','loc'],['future','nie-gen'],['future','pan'],['future'],['future','time'],['future','time'],['future','money'],['future']],
 8:[['perf'],['perf'],['perf','acc'],['perf','acc'],['perf','acc'],['perf','pan','instr'],['perf','qword'],['perf','time'],['perf','dat','time'],['perf','acc'],['perf','gen'],['perf']],
 9:[['acc','adj'],['acc','adj'],['acc','adj'],['acc','adj'],['acc','pan'],['acc','adj'],['acc','pron'],['acc','pron'],['acc','pron'],['pron','nie-gen'],['acc','adj','pan'],['acc']],

};

/* ===== Уроки 1–3: три группы спряжения в настоящем времени ===== */
LESSONS.push({
n:1, title:"Настоящее время: группа -am / -asz", sub:"czytam, czytasz, czyta… и глагол być",
rule:`<p>Польский глагол спрягается окончаниями, поэтому личное местоимение обычно опускается: <b>czytam</b> — уже «я читаю». Местоимение ставят только для противопоставления: <i>Ja czytam, a ty piszesz.</i></p>
<table><tr><th></th><th>czytać</th><th>mieć</th><th>być</th></tr>
<tr><th>ja</th><td>czytam</td><td>mam</td><td>jestem</td></tr>
<tr><th>ty</th><td>czytasz</td><td>masz</td><td>jesteś</td></tr>
<tr><th>on / ona / ono<br>Pan / Pani</th><td>czyta</td><td>ma</td><td>jest</td></tr>
<tr><th>my</th><td>czytamy</td><td>mamy</td><td>jesteśmy</td></tr>
<tr><th>wy</th><td>czytacie</td><td>macie</td><td>jesteście</td></tr>
<tr><th>oni / one<br>Państwo</th><td>czytają</td><td>mają</td><td>są</td></tr></table>
<ul>
<li>Группа -am/-asz — самая простая: основа инфинитива без -ć плюс окончание. Так спрягаются czytać, mieszkać, znać, pamiętać, czekać, słuchać, szukać, rozmawiać, kochać, а также mieć (mam, masz, ma…).</li>
<li>«У меня есть» = <b>mam</b>. Конструкции «u mnie jest» в польском нет.</li>
<li>Связка być не опускается: <i>Jestem w biurze. Klient jest w domu.</i></li>
<li>oni — «они», если в группе есть хотя бы один мужчина; one — только женщины, дети или предметы.</li>
<li>Уже в этом уроке встречаются падежи, которые разбираются позже: umowę (винительный, урок 9), muzyki / pracy (родительный после słuchać, szukać — урок 4), w Warszawie, z klientem (урок 11). Пока просто запоминайте форму целиком.</li>
<li>Вежливое «вы»: <b>Pan</b> (к мужчине) / <b>Pani</b> (к женщине) + глагол в 3-м лице ед. ч.: <i>Pani ma, Pan czyta.</i> Подробно — урок 12.</li>
</ul>
<p class="conv">Обозначения в заданиях: «Вы (мн.)» — несколько человек на ты (wy); «(Pan) / (Pani) / (Państwo)» — вежливое обращение; «(м.) / (ж.)» — род говорящего или собеседника.</p>`,
words:[["быть","być"],["иметь","mieć"],["знать","znać"],["читать","czytać"],["жить (проживать)","mieszkać"],["помнить","pamiętać"],["ждать","czekać"],["слушать","słuchać"],["искать","szukać"],["разговаривать","rozmawiać"],["время","czas"],["работа","praca"],["клиент","klient"],["договор","umowa"],["дом","dom"],["офис","biuro"],["музыка","muzyka"],["он / она","on / ona"]],
s:[
{ru:"Я живу в Варшаве.",pl:"Mieszkam w Warszawie.",acc:["[Ja] mieszkam w Warszawie"],d:["mieszkasz","mieszka","Warszawa"],note:"mieszkać: mieszkam, mieszkasz, mieszka, mieszkamy, mieszkacie, mieszkają. Местоимение ja опускается — окончание -m уже значит «я». Warszawa → w Warszawie (предложный падеж, урок 11)."},
{ru:"У меня есть время.",pl:"Mam czas.",acc:["[Ja] mam czas"],d:["masz","ma","czasu"],note:"«У меня есть» = просто mam (mieć: mam, masz, ma, mamy, macie, mają). czas — мужской неодушевлённый: винительный совпадает с именительным. Форма czasu — родительный, она нужна после nie (урок 4)."},
{ru:"Мы ждём клиента.",pl:"Czekamy na klienta.",acc:["[My] czekamy na klienta"],d:["czekam","czekają","klient"],note:"czekać na + винительный падеж. klient — одушевлённый, поэтому в винительном -a: klienta. Окончание -amy — «мы»."},
{ru:"Он читает договор.",pl:"Czyta umowę.",acc:["[On] czyta umowę"],d:["czytam","czytają","umowa"],note:"czyta — 3-е лицо ед. ч. (он / она / оно, а также Pan / Pani), без окончания. umowa → umowę: женский род в винительном -a → -ę (урок 9)."},
{ru:"Она помнит его.",pl:"Pamięta go.",acc:["{Pamięta go|Ona go pamięta|Ona pamięta go}"],d:["pamiętam","pamiętają","jego"],note:"«Его» = go — краткая безударная форма; она не стоит в начале предложения: Pamięta go / Ona go pamięta. Полная форма jego — только под ударением или в начале фразы."},
{ru:"Мы разговариваем с клиентом.",pl:"Rozmawiamy z klientem.",acc:["[My] rozmawiamy z klientem"],d:["rozmawiam","rozmawiają","klient"],note:"rozmawiać z + творительный падеж: klient → z klientem (урок 11). rozmawiamy — «мы»."},
{ru:"Они слушают музыку.",pl:"Słuchają muzyki.",acc:["[{Oni|One}] słuchają muzyki"],d:["słucha","słuchamy","muzykę"],note:"słuchać требует родительного падежа: muzyka → muzyki (не muzykę!). Окончание -ają — «они»."},
{ru:"Вы (мн.) ищете работу?",pl:"Szukacie pracy?",acc:["[Czy] [wy] szukacie pracy"],d:["szukam","szukają","pracę"],note:"szukać тоже требует родительного: praca → pracy. -acie — «вы» (несколько человек на ты). Вопрос задают интонацией или частицей czy (урок 5)."},
{ru:"Я в офисе.",pl:"Jestem w biurze.",acc:["[Ja] jestem w biurze"],d:["jest","jesteś","biuro"],note:"być — единственный по-настоящему неправильный глагол: jestem, jesteś, jest, jesteśmy, jesteście, są. Связка не опускается: «Я в офисе» = Jestem w biurze. biuro → w biurze (предложный, урок 11)."},
{ru:"Клиент дома.",pl:"Klient jest w domu.",acc:["Klient jest w domu"],d:["jestem","są","dom"],note:"«Дома» = w domu. Связку jest выбросить нельзя: Klient jest w domu — без неё фраза не польская."},
{ru:"У вас (Pani) есть время?",pl:"Ma Pani czas?",acc:["[Czy] {ma Pani|Pani ma} czas"],d:["masz","mam","Pan"],note:"Вежливое обращение: Pani (к женщине) / Pan (к мужчине) + глагол в 3-м лице ед. ч.: Pani ma. Не masz — так говорят только на ты. В вопросе глагол чаще ставят перед Pani: Ma Pani czas? Подробно — урок 12."}
]});

LESSONS.push({
n:2, title:"Настоящее время: группа -ę / -isz (-ysz)", sub:"mówię, mówisz, mówi… robić, lubić, płacić, dzwonić",
rule:`<p>Вторая группа — глаголы на -ić, -yć, -eć: mówić, robić, lubić, płacić, dzwonić, prosić, myśleć, widzieć, słyszeć, uczyć się, kończyć.</p>
<table><tr><th></th><th>mówić</th><th>robić</th><th>uczyć się</th><th>prosić</th></tr>
<tr><th>ja</th><td>mówię</td><td>robię</td><td>uczę się</td><td>proszę</td></tr>
<tr><th>ty</th><td>mówisz</td><td>robisz</td><td>uczysz się</td><td>prosisz</td></tr>
<tr><th>on / ona / ono<br>Pan / Pani</th><td>mówi</td><td>robi</td><td>uczy się</td><td>prosi</td></tr>
<tr><th>my</th><td>mówimy</td><td>robimy</td><td>uczymy się</td><td>prosimy</td></tr>
<tr><th>wy</th><td>mówicie</td><td>robicie</td><td>uczycie się</td><td>prosicie</td></tr>
<tr><th>oni / one<br>Państwo</th><td>mówią</td><td>robią</td><td>uczą się</td><td>proszą</td></tr></table>
<ul>
<li>После твёрдых шипящих cz, sz, ż, rz окончание пишется через -y: uczysz, kończysz, słyszysz, liczysz. В остальных случаях -i: mówisz, robisz, płacisz, dzwonisz.</li>
<li>Формы «я» и «они» иногда имеют другую основу: prosić → proszę, proszą (но prosisz); musieć → muszę, muszą (урок 10).</li>
<li>Частица się пишется отдельно и обычно стоит после глагола: uczę się, nazywam się.</li>
<li>Управление, не совпадающее с русским: dzwonić do kogoś (звонить кому-то), płacić za coś (платить за), prosić o coś (просить о), uczyć się czegoś (учить что-то — родительный), lubić coś (винительный: lubię kawę — «мне нравится кофе»).</li>
</ul>`,
words:[["говорить","mówić"],["делать","robić"],["любить, нравиться","lubić"],["платить","płacić"],["звонить","dzwonić"],["просить","prosić"],["думать","myśleć"],["видеть","widzieć"],["учиться","uczyć się"],["заканчивать","kończyć"],["слышать","słyszeć"],["по-польски","po polsku"],["счёт (фактура)","faktura"],["звонок, телефон","telefon"],["встреча","spotkanie"],["срок","termin"],["кофе","kawa"],["сейчас","teraz"],["проблема","problem"]],
s:[
{ru:"Я говорю по-польски.",pl:"Mówię po polsku.",acc:["[Ja] mówię po polsku"],d:["mówisz","mówi","polski"],note:"mówić: mówię, mówisz, mówi, mówimy, mówicie, mówią. «По-польски» = po polsku (застывшая форма; не po polski)."},
{ru:"Что ты сейчас делаешь?",pl:"Co teraz robisz?",acc:["Co [ty] {teraz robisz|robisz teraz}"],d:["robię","robi","robicie"],note:"robić: robię, robisz, robi, robimy, robicie, robią. Вопросительное слово co ставится в начало; частица czy при нём не нужна."},
{ru:"Он звонит клиенту.",pl:"Dzwoni do klienta.",acc:["[On] dzwoni do klienta"],d:["dzwonię","dzwonią","klientowi"],note:"Нормативная конструкция — dzwonić do + родительный: klient → do klienta. Дательный klientowi здесь не используется."},
{ru:"Мы платим за кофе.",pl:"Płacimy za kawę.",acc:["[My] płacimy za kawę"],d:["płacę","płacą","kawa"],note:"płacić za + винительный: kawa → za kawę. płacić: płacę, płacisz, płaci, płacimy, płacicie, płacą."},
{ru:"Они видят проблему.",pl:"Widzą problem.",acc:["[{Oni|One}] widzą problem"],d:["widzi","widzimy","problemu"],note:"widzieć: widzę, widzisz, widzi, widzimy, widzicie, widzą. problem — мужского рода (не женского, как в русском): винительный = именительный."},
{ru:"Ты любишь кофе?",pl:"Lubisz kawę?",acc:["[Czy] [ty] lubisz kawę"],d:["lubię","lubi","kawy"],note:"lubić + винительный: kawa → kawę. «Мне нравится кофе» по-польски — lubię kawę (буквально «я люблю»), без дательного падежа."},
{ru:"Я прошу счёт.",pl:"Proszę o fakturę.",acc:["[Ja] proszę o fakturę","Poproszę [o] fakturę"],d:["prosisz","prosi","faktura"],note:"prosić o + винительный: faktura → o fakturę. Чередование s → sz в формах «я» и «они»: proszę, prosisz, prosi, prosimy, prosicie, proszą. В ресторане чаще скажут Poproszę fakturę — тоже принимается."},
{ru:"Мы учим польский.",pl:"Uczymy się polskiego.",acc:["[My] uczymy się polskiego"],d:["uczę","uczą","polski"],note:"uczyć się + родительный: (język) polski → polskiego. Частица się — отдельное слово, обычно после глагола: uczymy się. uczyć: uczę, uczysz (после cz — -ysz), uczy, uczymy, uczycie, uczą."},
{ru:"Что вы (Pan) думаете?",pl:"Co Pan myśli?",acc:["Co {Pan myśli|myśli Pan}"],d:["myślisz","myślę","Pani"],note:"Pan + 3-е лицо: Pan myśli (myślisz — только к другу). myśleć: myślę, myślisz, myśli, myślimy, myślicie, myślą."},
{ru:"Я заканчиваю работу в пять.",pl:"Kończę pracę o piątej.",acc:["[Ja] kończę pracę o piątej"],d:["kończysz","kończy","praca"],note:"kończyć: kończę, kończysz, kończy, kończymy, kończycie, kończą. «В пять (часов)» = o piątej (o + предложный падеж от piąta godzina)."},
{ru:"Ты слышишь?",pl:"Słyszysz?",acc:["[Czy] [ty] słyszysz"],d:["słyszę","słyszy","słyszą"],note:"słyszeć: słyszę, słyszysz, słyszy, słyszymy, słyszycie, słyszą. Вопрос из одного глагола — обычное дело: Słyszysz? Ответ: Słyszę."}
]});

LESSONS.push({
n:3, title:"Настоящее время: группа -ę / -esz", sub:"pracuję, pracujesz… pisać, iść, jechać, chcieć, brać",
rule:`<p>Третья группа — самая разнообразная: глаголы на -ować (pracować, kupować, planować, dziękować) и глаголы с чередованием в основе (pisać, iść, jechać, chcieć, brać).</p>
<table><tr><th></th><th>pracować</th><th>pisać</th><th>iść</th><th>jechać</th><th>chcieć</th><th>brać</th></tr>
<tr><th>ja</th><td>pracuję</td><td>piszę</td><td>idę</td><td>jadę</td><td>chcę</td><td>biorę</td></tr>
<tr><th>ty</th><td>pracujesz</td><td>piszesz</td><td>idziesz</td><td>jedziesz</td><td>chcesz</td><td>bierzesz</td></tr>
<tr><th>on / ona / ono<br>Pan / Pani</th><td>pracuje</td><td>pisze</td><td>idzie</td><td>jedzie</td><td>chce</td><td>bierze</td></tr>
<tr><th>my</th><td>pracujemy</td><td>piszemy</td><td>idziemy</td><td>jedziemy</td><td>chcemy</td><td>bierzemy</td></tr>
<tr><th>wy</th><td>pracujecie</td><td>piszecie</td><td>idziecie</td><td>jedziecie</td><td>chcecie</td><td>bierzecie</td></tr>
<tr><th>oni / one<br>Państwo</th><td>pracują</td><td>piszą</td><td>idą</td><td>jadą</td><td>chcą</td><td>biorą</td></tr></table>
<ul>
<li>-ować → -uję: это самый продуктивный тип, к нему относятся почти все заимствования: planować, rezerwować, dyskutować, informować.</li>
<li>Формы «я» и «они» делят одну основу (jadę / jadą, biorę / biorą), формы «ты» — «вы» делят другую (jedziesz / jedziemy, bierzesz / bierzemy).</li>
<li>«Спасибо» — это глагол: dziękuję (я благодарю), dziękujemy (мы благодарим).</li>
<li>Направление движения: do + родительный (do sklepu, do domu, do biura), а не w + винительный.</li>
<li>Настоящее время с указанием времени обозначает ближайшее будущее: Jutro kupuję kawę.</li>
</ul>`,

{ru:"Я работаю в фирме.",pl:"Pracuję w firmie.",acc:["[Ja] pracuję w firmie"],d:["pracujesz","pracuje","firma"],note:"Глаголы на -ować: -ować → -uję: pracuję, pracujesz, pracuje, pracujemy, pracujecie, pracują. firma → w firmie (предложный, урок 11)."},
{ru:"Ты пишешь оферту?",pl:"Piszesz ofertę?",acc:["[Czy] [ty] piszesz ofertę"],d:["piszę","pisze","oferta"],note:"pisać → piszę, piszesz, pisze, piszemy, piszecie, piszą (s → sz во всех формах настоящего). oferta → ofertę (винительный)."},
{ru:"Мы идём в магазин.",pl:"Idziemy do sklepu.",acc:["[My] idziemy do sklepu"],d:["idę","idą","sklep"],note:"iść: idę, idziesz, idzie, idziemy, idziecie, idą. Направление «в магазин» = do + родительный: sklep → do sklepu (не w sklep!)."},
{ru:"Он едет домой.",pl:"Jedzie do domu.",acc:["[On] jedzie do domu"],d:["jadę","jadą","dom"],note:"jechać (на транспорте): jadę, jedziesz, jedzie, jedziemy, jedziecie, jadą — чередование ja- / je-. «Домой» = do domu."},
{ru:"Я хочу кофе.",pl:"Chcę kawę.",acc:["[Ja] chcę {kawę|kawy}"],d:["chcesz","chce","kawa"],note:"chcieć: chcę, chcesz, chce, chcemy, chcecie, chcą. kawa → kawę (винительный). Chcę kawy (родительный) — «хочу (немного) кофе», тоже верно. Вежливее: Poproszę kawę."},

{ru:"Мы берём такси.",pl:"Bierzemy taksówkę.",acc:["[My] bierzemy taksówkę"],d:["biorę","biorą","taksówka"],note:"brać: biorę, bierzesz, bierze, bierzemy, bierzecie, biorą — основа bior- в формах «я» и «они», bierz- в остальных. taksówka → taksówkę."},
{ru:"Спасибо за сообщение.",pl:"Dziękuję za wiadomość.",acc:["Dziękuję za wiadomość"],d:["dziękujemy","dziękujesz","wiadomości"],note:"«Спасибо» — это глагол dziękuję («благодарю»); от нескольких человек — dziękujemy. dziękować za + винительный; wiadomość (женский род на согласный) в винительном не меняется."},

{ru:"Завтра я покупаю кофе.",pl:"Jutro kupuję kawę.",acc:["[Ja] {jutro kupuję kawę|kupuję kawę jutro|kupuję jutro kawę}","Jutro [ja] kupuję kawę"],d:["kupujesz","kupują","kawa"],note:"kupować → kupuję. Настоящее время с указанием времени обозначает ближайшее будущее: Jutro kupuję kawę. Обстоятельство времени чаще стоит в начале."},
{ru:"Куда ты идёшь?",pl:"Dokąd idziesz?",acc:["{Dokąd|Gdzie} [ty] idziesz"],d:["idę","idzie","idą"],note:"«Куда» = dokąd (норма). В разговорной речи почти всегда gdzie idziesz? — тренажёр это принимает, но dokąd — нормативный вариант."}

/* ===== Уроки 4–6: отрицание, вопрос, прошедшее время ===== */
LESSONS.push({
n:4, title:"Отрицание nie и родительный падеж", sub:"nie mam czasu, nie ma biura, nic nie wiem",
rule:`<p>Отрицание строится одинаково во всех временах: <b>nie</b> пишется отдельно и стоит прямо перед глаголом. Главная ловушка: прямое дополнение при отрицании переходит из винительного падежа в родительный.</p>
<table><tr><th>Утверждение (вин. п.)</th><th>Отрицание (род. п.)</th></tr>
<tr><td>Mam czas.</td><td>Nie mam czas<b>u</b>.</td></tr>
<tr><td>Czytam umow<b>ę</b>.</td><td>Nie czytam umow<b>y</b>.</td></tr>
<tr><td>Znam klient<b>a</b>.</td><td>Nie znam klient<b>a</b>. (одуш.: вин. = род.)</td></tr>
<tr><td>Mamy pieniądze.</td><td>Nie mamy pieni<b>ę</b>dz<b>y</b>.</td></tr>
<tr><td>Jest biuro.</td><td>Nie ma biur<b>a</b>.</td></tr></table>
<p>Окончания родительного: мужской неодушевлённый обычно -u (czasu, budżetu, sklepu, domu, dokumentu, telefonu), у части слов -a (chleba, ołówka) — такие запоминаются по словарю; одушевлённый -a (klienta, szefa); женский -y, после k, g — -i (umowy, faktury, reklamy, książki); средний -a (biura, spotkania, pytania).</p>
<ul>
<li>«Нет (не имеется)» — застывшая форма <b>nie ma</b> + родительный: Nie ma czasu. Nie ma pieniędzy. Nie ma Pana Kowalskiego. Она не меняется по числам.</li>
<li>Двойное отрицание обязательно, как в русском: nic nie wiem, nikt nie dzwoni, nigdy nie płaci. При nikt и nic глагол стоит в 3-м лице ед. ч.</li>
<li>Родительный требуется только у прямого дополнения. Дополнение с предлогом не меняется: nie mamy budżetu <i>na reklamę</i>; nie płaci <i>na czas</i>.</li>
<li>Если отрицается не глагол, а именная часть, jest часто опускается: To nie problem. To nie ja.</li>
<li>Два «знать»: <b>znać</b> — знать кого-то / что-то (znam klienta, znam Warszawę); <b>wiedzieć</b> — знать, что / где / когда (wiem, gdzie on jest).</li>
</ul>
<p>Подтип -em/-esz: rozumieć — rozumiem, rozumiesz, rozumie, rozumiemy, rozumiecie, rozumieją; wiedzieć — wiem, wiesz, wie, wiemy, wiecie, wiedzą.</p>`,

LESSONS.push({

<p>С вопросительным словом czy не нужно: <i>Co robisz? Gdzie jest biuro?</i></p>

<tr><td>gdzie</td><td>где</td><td>Gdzie jest biuro?</td></tr>
<tr><td>dokąd</td><td>куда</td><td>Dokąd idziesz?</td></tr>
<tr><td>skąd</td><td>откуда</td><td>Skąd jesteś?</td></tr>

<tr><td>dlaczego / czemu</td><td>почему</td><td>Dlaczego nie dzwonisz?</td></tr>
<tr><td>jak</td><td>как</td><td>Jak się Pan nazywa?</td></tr>
<tr><td>ile</td><td>сколько</td><td>Ile to kosztuje?</td></tr>
<tr><td>jaki / jaka / jakie</td><td>какой / какая / какое</td><td>Jaka jest cena?</td></tr>
<tr><td>który / która / które</td><td>который</td><td>Który klient?</td></tr></table>
<ul>
<li>В вопросе с Pan / Pani глагол обычно идёт первым: Ma Pan czas? Jak się Pani nazywa?</li>

<li>Ответы: tak (да), nie (нет), oczywiście (конечно), może (может быть), nie wiem (не знаю).</li>
</ul>`,

<ul>
<li>Оба варианта правильны. Вариант с инфинитивом проще и не требует рода; вариант с -ł чуть более разговорный. Тренажёр принимает оба.</li>
<li>Будущее самого być — просто będę: <i>Jutro będę w biurze.</i> Никогда не «będę być».</li>
<li>Отрицание — перед вспомогательным глаголом: <i>nie będzie płacić.</i></li>
<li>Вопрос — czy + та же конструкция: <i>Czy będziesz pracować w sobotę?</i></li>
<li>Для разовых действий поляки чаще используют совершенный вид (урок 8): <i>Zadzwonię</i> (позвоню), а не <i>będę dzwonić</i> (буду звонить).</li>
</ul>
<p>Дни недели с предлогом w + винительный: w poniedziałek, we wtorek, w środę, w czwartek, w piątek, w sobotę, w niedzielę. «На следующей неделе» = w przyszłym tygodniu, «на прошлой» = w zeszłym tygodniu, «через неделю» = za tydzień.</p>`,
words:[["буду / будешь / будет","będę / będziesz / będzie"],["на следующей неделе","w przyszłym tygodniu"],["через неделю","za tydzień"],["в понедельник","w poniedziałek"],["во вторник","we wtorek"],["в среду","w środę"],["в четверг","w czwartek"],["в пятницу","w piątek"],["в субботу","w sobotę"],["в воскресенье","w niedzielę"],["цена","cena"],["проверять","sprawdzać"],["отправлять","wysyłać"],["позже","później"],["много","dużo"],["дорого","drogo"],["дёшево","tanio"]],
s:[
{ru:"Я буду ждать.",pl:"Będę czekać.",acc:["[Ja] będę {czekać|czekał|czekała}"],d:["będziesz","czekam","będzie"],note:"Будущее несовершенного вида: będę + инфинитив (będę czekać). Второй правильный вариант — będę + форма на -ł с родом: będę czekał (м.) / czekała (ж.). Принимаются оба."},
{ru:"Завтра я буду в офисе.",pl:"Jutro będę w biurze.",acc:["[Ja] {jutro będę w biurze|będę jutro w biurze|będę w biurze jutro}","Jutro [ja] będę w biurze"],d:["będziesz","jestem","biuro"],note:"У być будущее — просто będę, без второго глагола: Będę w biurze. Не «będę być»!"},
{ru:"Ты будешь работать в субботу?",pl:"Będziesz pracować w sobotę?",acc:["[Czy] [ty] {będziesz {pracować|pracował|pracowała} w sobotę|w sobotę będziesz {pracować|pracował|pracowała}}"],d:["będę","pracujesz","sobota"],note:"Дни недели с w + винительный: w sobotę, w środę, w piątek, w poniedziałek, we wtorek (we — перед wt-). będziesz — «ты будешь»."},
{ru:"Мы будем разговаривать о цене.",pl:"Będziemy rozmawiać o cenie.",acc:["[My] będziemy {rozmawiać|rozmawiali|rozmawiały} o cenie"],d:["będę","rozmawiamy","cenę"],note:"rozmawiać o + предложный: cena → o cenie. «Будем» = będziemy."},
{ru:"Он не будет платить.",pl:"Nie będzie płacić.",acc:["[On] nie będzie {płacić|płacił}"],d:["będą","płaci","będę"],note:"Отрицание в будущем: nie перед będzie: nie będzie płacić. Отрицается вспомогательный глагол, а не инфинитив."},
{ru:"Когда вы (Pani) будете в Варшаве?",pl:"Kiedy będzie Pani w Warszawie?",acc:["Kiedy {będzie Pani|Pani będzie} w Warszawie"],d:["będziesz","będą","Pan"],note:"Pani + 3-е лицо: będzie Pani / Pani będzie. Порядок «глагол — Pani» типичен для вопросов."},
{ru:"Они будут проверять документы.",pl:"Będą sprawdzać dokumenty.",acc:["[{Oni|One}] będą {sprawdzać|sprawdzali|sprawdzały} dokumenty"],d:["będzie","sprawdzają","dokumentów"],note:"dokument → мн. ч. dokumenty (у неодушевлённых винительный = именительный). «Будут» = będą."},
{ru:"На следующей неделе будет встреча.",pl:"W przyszłym tygodniu będzie spotkanie.",acc:["{W przyszłym tygodniu będzie spotkanie|Spotkanie będzie w przyszłym tygodniu|Będzie spotkanie w przyszłym tygodniu}"],d:["będą","zeszłym","spotkania"],note:"«На следующей неделе» = w przyszłym tygodniu (предложный). Ср. «на прошлой неделе» = w zeszłym tygodniu. będzie — «будет»."},

{ru:"Я буду звонить позже.",pl:"Będę dzwonić później.",acc:["[Ja] {będę {dzwonić|dzwonił|dzwoniła} później|później będę {dzwonić|dzwonił|dzwoniła}}"],d:["będziesz","dzwonię","wcześniej"],note:"później — «позже» (wcześniej — «раньше»). Естественнее сказать совершенным видом: Zadzwonię później (урок 8), но будущее с będę тоже верно."}

LESSONS.push({
n:8, title:"Вид: совершенная форма как будущее", sub:"zrobię, powiem, kupię, wyślę, zadzwonię",
rule:`<p>У глаголов совершенного вида нет настоящего времени. Их «настоящая» форма означает будущее — точно как в русском: <b>zrobię</b> = «сделаю», <b>powiem</b> = «скажу», <b>kupię</b> = «куплю». Спрягаются они по тем же трём группам.</p>
<table><tr><th>несов. (процесс)</th><th>сов. (результат)</th><th>«я» (= будущее)</th><th>«он / она»</th></tr>
<tr><td>robić</td><td>zrobić</td><td>zrobię</td><td>zrobi</td></tr>
<tr><td>mówić</td><td>powiedzieć</td><td>powiem</td><td>powie</td></tr>
<tr><td>kupować</td><td>kupić</td><td>kupię</td><td>kupi</td></tr>
<tr><td>pisać</td><td>napisać</td><td>napiszę</td><td>napisze</td></tr>
<tr><td>wysyłać</td><td>wysłać</td><td>wyślę</td><td>wyśle</td></tr>
<tr><td>dzwonić</td><td>zadzwonić</td><td>zadzwonię</td><td>zadzwoni</td></tr>
<tr><td>płacić</td><td>zapłacić</td><td>zapłacę</td><td>zapłaci</td></tr>
<tr><td>czytać</td><td>przeczytać</td><td>przeczytam</td><td>przeczyta</td></tr>
<tr><td>sprawdzać</td><td>sprawdzić</td><td>sprawdzę</td><td>sprawdzi</td></tr>
<tr><td>dawać</td><td>dać</td><td>dam</td><td>da</td></tr>
<tr><td>iść</td><td>pójść</td><td>pójdę</td><td>pójdzie</td></tr>
<tr><td>widzieć</td><td>zobaczyć</td><td>zobaczę</td><td>zobaczy</td></tr>
<tr><td>przygotowywać</td><td>przygotować</td><td>przygotuję</td><td>przygotuje</td></tr></table>
<ul>
<li>Совершенный вид образуется приставкой (z-, za-, na-, wy-, po-, prze-) или другой основой (kupować → kupić, mówić → powiedzieć).</li>
<li>Не соединяйте będę с совершенным видом: «będę zrobić» — ошибка. Либо będę robić, либо zrobię.</li>
<li>Неправильные формы: powiedzieć — powiem, powiesz, powie, powiemy, powiecie, powiedzą; dać — dam, dasz, da, damy, dacie, dadzą.</li>
<li>В деловой речи будущее почти всегда совершенного вида: Zadzwonię. Wyślę fakturę. Sprawdzę i dam znać (проверю и дам знать).</li>
</ul>`,
words:[["сделать","zrobić (zrobię)"],["сказать","powiedzieć (powiem)"],["купить","kupić (kupię)"],["написать","napisać (napiszę)"],["отправить","wysłać (wyślę)"],["позвонить","zadzwonić (zadzwonię)"],["заплатить","zapłacić (zapłacę)"],["прочитать","przeczytać (przeczytam)"],["проверить","sprawdzić (sprawdzę)"],["дать","dać (dam)"],["пойти","pójść (pójdę)"],["подготовить","przygotować (przygotuję)"],["увидеть","zobaczyć (zobaczę)"],["решить","zdecydować (zdecyduję)"],["сразу, сейчас же","zaraz"],["через час","za godzinę"],["карта (банковская)","karta"]],
s:[
{ru:"Я сделаю это завтра.",pl:"Zrobię to jutro.",acc:["[Ja] {zrobię to jutro|jutro to zrobię|zrobię jutro to}","Jutro [ja] to zrobię"],d:["robię","zrobi","będę"],note:"Совершенный вид в форме настоящего = будущее: zrobię — «сделаю». Не «będę zrobić»! Пара: robić (делать) → zrobić (сделать)."},
{ru:"Я позвоню позже.",pl:"Zadzwonię później.",acc:["[Ja] {zadzwonię później|później zadzwonię}"],d:["dzwonię","zadzwoni","będę"],note:"dzwonić (звонить, процесс) → zadzwonić (позвонить, разово): zadzwonię, zadzwonisz, zadzwoni… Самая частая деловая фраза: Zadzwonię później."},
{ru:"Он купит кофе.",pl:"Kupi kawę.",acc:["[On] kupi kawę"],d:["kupuje","kupię","kawa"],note:"kupować (покупать) → kupić (купить): kupię, kupisz, kupi, kupimy, kupicie, kupią. kupi — «купит»."},
{ru:"Мы напишем оферту сегодня.",pl:"Napiszemy ofertę dzisiaj.",acc:["[My] {napiszemy ofertę {dzisiaj|dziś}|{dzisiaj|dziś} napiszemy ofertę}","{Dzisiaj|Dziś} [my] napiszemy ofertę"],d:["piszemy","napiszę","oferta"],note:"pisać → napisać: napiszę, napiszesz, napisze, napiszemy, napiszecie, napiszą. dzisiaj = dziś."},
{ru:"Я сразу отправлю счёт.",pl:"Zaraz wyślę fakturę.",acc:["[Ja] {zaraz wyślę fakturę|wyślę fakturę zaraz|wyślę zaraz fakturę}","Zaraz [ja] wyślę fakturę"],d:["wysyłam","wyśle","faktury"],note:"wysyłać → wysłać: wyślę, wyślesz, wyśle, wyślemy, wyślecie, wyślą. zaraz — «сейчас же, сразу»."},
{ru:"Вы (Pan) заплатите картой?",pl:"Zapłaci Pan kartą?",acc:["[Czy] {zapłaci Pan|Pan zapłaci} kartą"],d:["zapłacisz","płaci","karta"],note:"zapłacić: zapłacę, zapłacisz, zapłaci… «Картой» — творительный: karta → kartą (урок 11). Pan + 3-е лицо."},
{ru:"Что ты скажешь?",pl:"Co powiesz?",acc:["Co [ty] powiesz"],d:["mówisz","powiem","powie"],note:"powiedzieć — неправильный: powiem, powiesz, powie, powiemy, powiecie, powiedzą. Пара: mówić (говорить) → powiedzieć (сказать)."},
{ru:"Они проверят документы в понедельник.",pl:"Sprawdzą dokumenty w poniedziałek.",acc:["[{Oni|One}] {sprawdzą dokumenty w poniedziałek|w poniedziałek sprawdzą dokumenty}","W poniedziałek [{oni|one}] sprawdzą dokumenty"],d:["sprawdzają","sprawdzi","dokumentów"],note:"sprawdzać → sprawdzić: sprawdzę, sprawdzisz, sprawdzi, sprawdzimy, sprawdzicie, sprawdzą. sprawdzą — «проверят»."},
{ru:"Я дам тебе ответ через час.",pl:"Dam ci odpowiedź za godzinę.",acc:["[Ja] {dam ci odpowiedź za godzinę|za godzinę dam ci odpowiedź}","Za godzinę [ja] dam ci odpowiedź"],d:["daję","da","tobie"],note:"dać: dam, dasz, da, damy, dacie, dadzą. «Тебе» — ci (краткая безударная форма; tobie — только под ударением). «Через час» = za godzinę."},
{ru:"Мы пойдём на встречу.",pl:"Pójdziemy na spotkanie.",acc:["[My] pójdziemy na spotkanie"],d:["idziemy","pójdę","spotkania"],note:"iść → pójść: pójdę, pójdziesz, pójdzie, pójdziemy, pójdziecie, pójdą. «На встречу» = na spotkanie (винительный)."},
{ru:"Она подготовит договор до пятницы.",pl:"Przygotuje umowę do piątku.",acc:["[Ona] przygotuje umowę do piątku"],d:["przygotuję","przygotowuje","piątek"],note:"przygotować: przygotuję, przygotujesz, przygotuje… «До пятницы» = do piątku (do + родительный: piątek → piątku). przygotowuje — несов. вид «готовит»."},
{ru:"Я решу завтра.",pl:"Zdecyduję jutro.",acc:["[Ja] {zdecyduję jutro|jutro zdecyduję}"],d:["zdecyduje","decyduję","będę"],note:"zdecydować: zdecyduję, zdecydujesz, zdecyduje. Несов. вид — decydować (decyduję — «решаю, принимаю решения»)."}
]});

LESSONS.push({
n:9, title:"Винительный падеж дополнения", sub:"nową umowę, dobrego klienta, tę książkę, znam go",
rule:`<p>Винительный падеж отвечает на вопрос «кого? что?» и стоит у прямого дополнения (без отрицания) и после предлогов na, za, o, w (куда? когда?), przez.</p>
<table><tr><th>Род</th><th>Именительный</th><th>Винительный</th><th>Правило</th></tr>
<tr><td>м. неодушевлённый</td><td>nowy telefon</td><td>nowy telefon</td><td>= именительный</td></tr>
<tr><td>м. одушевлённый</td><td>dobry klient</td><td>dobr<b>ego</b> klient<b>a</b></td><td>= родительный</td></tr>
<tr><td>ж. на -a</td><td>nowa umowa</td><td>now<b>ą</b> umow<b>ę</b></td><td>-a → -ę (у прилагательного -ą)</td></tr>
<tr><td>ж. на согласный</td><td>ta wiadomość</td><td>tę wiadomość</td><td>= именительный</td></tr>
<tr><td>средний</td><td>dobre pytanie</td><td>dobre pytanie</td><td>= именительный</td></tr>
<tr><td>мн. ч., не мужчины</td><td>nowe faktury</td><td>nowe faktury</td><td>= именительный</td></tr>
<tr><td>мн. ч., мужчины</td><td>nowi klienci</td><td>now<b>ych</b> klient<b>ów</b></td><td>= родительный</td></tr></table>
<p>Указательное «эту»: норма — <b>tę</b> umowę; в живой речи почти все говорят <b>tą</b> umowę (по аналогии с nową). Тренажёр принимает оба, но нормативный вариант — tę: так пишут в документах и требуют на экзаменах. Мужской и средний род: ten telefon, tego klienta, to spotkanie.</p>
<table><tr><th></th><th>меня</th><th>тебя</th><th>его</th><th>её</th><th>нас</th><th>вас</th><th>их</th></tr>
<tr><th>вин.</th><td>mnie</td><td>cię</td><td>go</td><td>ją</td><td>nas</td><td>was</td><td>ich (мужчины) / je</td></tr>
<tr><th>род. (после nie)</th><td>mnie</td><td>cię</td><td>go</td><td>jej</td><td>nas</td><td>was</td><td>ich</td></tr>
<tr><th>после предлога</th><td>na mnie</td><td>na ciebie</td><td>na niego</td><td>na nią</td><td>na nas</td><td>na was</td><td>na nich / na nie</td></tr></table>
<ul>
<li>Краткие формы go, cię, ją не ставятся в начало предложения; полные jego, ciebie используются под ударением и после предлогов.</li>
<li>Отрицание меняет падеж и у местоимений: Znam ją → Nie znam jej.</li>
<li>Państwo (вежливое «вы» к группе) в винительном → Państwa: Zapraszam Państwa.</li>
</ul>`,
words:[["новый","nowy"],["хороший","dobry"],["этот / эта / это","ten / ta / to"],["эту (вин. п.)","tę"],["телефон","telefon"],["книга","książka"],["презентация","prezentacja"],["проект","projekt"],["партнёр","partner"],["руководитель","kierownik"],["меня / тебя","mnie / cię"],["его / её","go / ją"],["нас / вас","nas / was"],["их","ich"],["приглашать","zapraszać"],["спрашивать","pytać"],["но","ale"]],
s:[
{ru:"Я подписываю новый договор.",pl:"Podpisuję nową umowę.",acc:["[Ja] podpisuję nową umowę"],d:["nowy","umowa","podpisuje"],note:"Женский род в винительном: -a → -ę у существительного и -a → -ą у прилагательного: nowa umowa → nową umowę. podpisywać → podpisuję (несов. вид)."},
{ru:"Он покупает новый телефон.",pl:"Kupuje nowy telefon.",acc:["[On] kupuje nowy telefon"],d:["nowego","nową","telefonu"],note:"Мужской неодушевлённый: винительный = именительный, у прилагательного тоже: nowy telefon. Форма nowego — только для одушевлённых (nowego klienta)."},
{ru:"Мы знаем хорошего партнёра.",pl:"Znamy dobrego partnera.",acc:["[My] znamy dobrego partnera"],d:["dobry","partner","dobrą"],note:"Мужской одушевлённый: винительный = родительный: dobry partner → dobrego partnera (-ego / -a)."},
{ru:"Ты видишь эту книгу?",pl:"Widzisz tę książkę?",acc:["[Czy] [ty] widzisz {tę|tą} książkę"],d:["ta","książka","ten"],note:"Норма: tę książkę. В живой речи почти все говорят tą książkę — по аналогии с nową. Тренажёр принимает оба, но пишите tę: это нормативная форма (в документах и на экзамене)."},
{ru:"Я приглашаю вас (Państwo) на презентацию.",pl:"Zapraszam Państwa na prezentację.",acc:["[Ja] zapraszam Państwa na prezentację"],d:["Państwo","prezentacja","zapraszasz"],note:"Państwo (вежливое «вы» к группе) в винительном → Państwa. na + винительный: prezentacja → na prezentację. zapraszać: zapraszam."},
{ru:"Она любит эту работу.",pl:"Lubi tę pracę.",acc:["[Ona] lubi {tę|tą} pracę"],d:["ta","pracy","lubię"],note:"praca → pracę; tę (норма) / tą (разговорное). После lubić — винительный, а не родительный: lubi pracę, но nie lubi pracy."},
{ru:"Мы ждём их.",pl:"Czekamy na nich.",acc:["[My] czekamy na {nich|nie}"],d:["ich","je","nas"],note:"После предлога — формы с n-: na nich (их — есть мужчины), na nie (их — женщины или предметы), na niego, na nią. Без предлога: ich, je, go, ją."},
{ru:"Ты понимаешь меня?",pl:"Rozumiesz mnie?",acc:["[Czy] [ty] {rozumiesz mnie|mnie rozumiesz}"],d:["mi","cię","rozumiem"],note:"«Меня» = mnie (винительный). Rozumiesz mnie? / Czy ty mnie rozumiesz? Форма mi — дательный («мне»): daj mi."},
{ru:"Он спрашивает тебя о цене.",pl:"Pyta cię o cenę.",acc:["[On] pyta cię o cenę"],d:["ciebie","ci","ceny"],note:"pytać kogoś o coś: cię (винительный, краткая форма) + o + винительный: o cenę. ciebie — только под ударением или после предлога; ci — дательный («тебе»)."},

LESSONS.push({
n:10, title:"Модальные: muszę, mogę, trzeba, można, wolno, powinien", sub:"muszę iść, można tu parkować?, nie wolno palić",
rule:`<p>После модального слова всегда стоит инфинитив. Одни модальные спрягаются как обычные глаголы, другие — безличные и не меняются вовсе.</p>
<table><tr><th></th><th>musieć<br>(должен, надо)</th><th>móc<br>(мочь)</th><th>umieć<br>(уметь)</th><th>chcieć<br>(хотеть)</th></tr>
<tr><th>ja</th><td>muszę</td><td>mogę</td><td>umiem</td><td>chcę</td></tr>
<tr><th>ty</th><td>musisz</td><td>możesz</td><td>umiesz</td><td>chcesz</td></tr>
<tr><th>on / ona / Pan / Pani</th><td>musi</td><td>może</td><td>umie</td><td>chce</td></tr>
<tr><th>my</th><td>musimy</td><td>możemy</td><td>umiemy</td><td>chcemy</td></tr>
<tr><th>wy</th><td>musicie</td><td>możecie</td><td>umiecie</td><td>chcecie</td></tr>
<tr><th>oni / one / Państwo</th><td>muszą</td><td>mogą</td><td>umieją</td><td>chcą</td></tr></table>
<p>Безличные (не спрягаются): <b>trzeba</b> — нужно (trzeba wysłać ofertę); <b>można</b> — можно (czy można tu parkować?); <b>wolno</b> — разрешено (tu wolno palić); <b>nie wolno</b> — запрещено (строже, чем nie można); <b>warto</b> — стоит (warto sprawdzić).</p>
<p><b>powinien</b> — «должен бы, следует» — меняется по роду и лицу, без глагола być:</p>
<table><tr><th></th><th>мужской</th><th>женский</th></tr>
<tr><th>ja</th><td>powinienem</td><td>powinnam</td></tr>
<tr><th>ty</th><td>powinieneś</td><td>powinnaś</td></tr>
<tr><th>on / ona / Pan / Pani</th><td>powinien</td><td>powinna</td></tr>
<tr><th>my</th><td>powinniśmy</td><td>powinnyśmy</td></tr>
<tr><th>wy</th><td>powinniście</td><td>powinnyście</td></tr>
<tr><th>oni / one</th><td>powinni</td><td>powinny</td></tr></table>
<ul>
<li>móc — «мочь» (возможность, разрешение), umieć — «уметь» (навык). Русское «можешь говорить по-польски?» = Umiesz mówić po polsku?</li>
<li>Вежливая просьба: Może Pan…? / Czy mogłaby Pani…? (ещё вежливее).</li>
<li>«Мне нужно что-то» (предмет) — potrzebować + родительный: potrzebuję pomocy, potrzebuję czasu. «Нужно что-то сделать» — trzeba / muszę + инфинитив.</li>
</ul>`,
words:[["должен, мне надо","musieć (muszę)"],["мочь","móc (mogę)"],["нужно (безлично)","trzeba"],["можно","można"],["нельзя, запрещено","nie wolno"],["разрешено","wolno"],["следует, должен бы","powinien / powinna"],["уметь","umieć (umiem)"],["нуждаться в","potrzebować (+ род. п.)"],["помощь","pomoc"],["парковаться","parkować"],["курить","palić"],["повторить","powtórzyć"],["ещё раз","jeszcze raz"],["отдыхать","odpoczywać"],["спать","spać"],["рано","wcześnie"]],
s:[
{ru:"Я должен идти.",pl:"Muszę iść.",acc:["[Ja] muszę iść"],d:["musisz","musi","idę"],note:"musieć — «быть должным, надо»: muszę, musisz, musi, musimy, musicie, muszą. После модального — инфинитив: muszę iść."},
{ru:"Ты можешь позвонить завтра?",pl:"Możesz zadzwonić jutro?",acc:["[Czy] [ty] {możesz zadzwonić jutro|możesz jutro zadzwonić|jutro możesz zadzwonić}"],d:["mogę","może","zadzwonisz"],note:"móc: mogę, możesz, może, możemy, możecie, mogą (g → ż в середине). После «можешь» — обычно совершенный вид: zadzwonić (разово)."},
{ru:"Нужно отправить оферту.",pl:"Trzeba wysłać ofertę.",acc:["Trzeba wysłać ofertę"],d:["muszę","można","oferty"],note:"trzeba — безличное «нужно», не спрягается, за ним инфинитив. Дополнение в винительном: ofertę (при отрицании — родительный: nie trzeba wysyłać oferty)."},
{ru:"Здесь можно парковаться?",pl:"Czy można tu parkować?",acc:["[Czy] {{można|wolno} {tu|tutaj} parkować|{tu|tutaj} {można|wolno} parkować|{można|wolno} parkować {tu|tutaj}}"],d:["mogę","możesz","parkuję"],note:"można — «можно» (есть возможность или разрешено), безличное, не спрягается. Синоним в значении «разрешено» — wolno (тоже принимается). «Здесь» = tu / tutaj."},
{ru:"Здесь нельзя курить.",pl:"Tu nie wolno palić.",acc:["{Tu|Tutaj} nie {wolno|można} palić","Nie {wolno|można} {tu|tutaj} palić","Nie {wolno|można} palić {tu|tutaj}"],d:["trzeba","palę","musi"],note:"Запрет: nie wolno (строго, «запрещено») или nie można (мягче, «нельзя»). Оба верны. На табличках: Zakaz palenia."},
{ru:"Вам (Pan) нужно проверить счёт.",pl:"Musi Pan sprawdzić fakturę.",acc:["{Musi Pan|Pan musi} sprawdzić fakturę"],d:["musisz","powinien","faktury"],note:"«Вам нужно» = musi Pan / musi Pani (3-е лицо). Не путайте с powinien (следует): Powinien Pan sprawdzić — «вам следовало бы»."},
{ru:"Мне (ж.) следует позвонить клиенту.",pl:"Powinnam zadzwonić do klienta.",acc:["[Ja] powinnam zadzwonić do klienta"],d:["powinienem","powinna","klientowi"],note:"powinien — «должен (бы), следует»: м. powinienem, powinieneś, powinien; ж. powinnam, powinnaś, powinna. Без глагола być. zadzwonić do + родительный."},
{ru:"Мы не можем ждать.",pl:"Nie możemy czekać.",acc:["[My] nie możemy czekać"],d:["mogę","możecie","czekamy"],note:"nie + móc: nie możemy czekać. Инфинитив несов. вида czekać — процесс."},
{ru:"Ты умеешь говорить по-польски?",pl:"Umiesz mówić po polsku?",acc:["[Czy] [ty] umiesz mówić po polsku"],d:["możesz","umiem","umie"],note:"umieć — «уметь» (навык): umiem, umiesz, umie, umiemy, umiecie, umieją. móc — «мочь» (возможность). Русское «можешь говорить по-польски?» по-польски — umiesz."},
{ru:"Мне нужна помощь.",pl:"Potrzebuję pomocy.",acc:["[Ja] potrzebuję pomocy"],d:["pomoc","potrzebujesz","trzeba"],note:"potrzebować + родительный: pomoc → pomocy. «Мне нужно / нужна (что-то)» = potrzebuję (я нуждаюсь). Ср. trzeba + инфинитив — нужно что-то сделать."},
{ru:"Можете (Pani) повторить ещё раз?",pl:"Może Pani powtórzyć jeszcze raz?",acc:["[Czy] {może Pani|Pani może} {powtórzyć jeszcze raz|jeszcze raz powtórzyć}"],d:["możesz","mogę","Pan"],note:"Просьба через móc: Może Pani…? / Czy może Pan…? powtórzyć — «повторить», jeszcze raz — «ещё раз»."},
{ru:"Они должны заплатить сегодня.",pl:"Muszą zapłacić dzisiaj.",acc:["[{Oni|One}] {muszą zapłacić {dzisiaj|dziś}|{dzisiaj|dziś} muszą zapłacić}"],d:["musi","musimy","zapłacą"],note:"musieć → muszą (они). После musieć — инфинитив нужного вида: zapłacić (разово). zapłacą — «заплатят», это уже будущее без модального."}
]});

LESSONS.push({
n:11, title:"Творительный и предложный падежи", sub:"jestem inżynierem, jadę samochodem, mieszkam w Polsce",
rule:`<p><b>Творительный</b> (кем? чем?) нужен после być, когда называете профессию, статус или национальность; после предлога z (с кем?); для средства передвижения и способа оплаты; после interesować się.</p>
<table><tr><th>Род</th><th>Именительный</th><th>Творительный</th><th>Правило</th></tr>
<tr><td>мужской</td><td>inżynier, klient, szef</td><td>inżynier<b>em</b>, klient<b>em</b>, szef<b>em</b></td><td>-em; после k, g → -iem (pociąg<b>iem</b>, bank<b>iem</b>)</td></tr>
<tr><td>женский</td><td>Ukrainka, karta, koleżanka</td><td>Ukraink<b>ą</b>, kart<b>ą</b>, koleżank<b>ą</b></td><td>-a → -ą; на согласный: sprzedaż → sprzedaż<b>ą</b></td></tr>
<tr><td>средний</td><td>biuro, miasto</td><td>biur<b>em</b>, miast<b>em</b></td><td>-o → -em</td></tr></table>
<p><b>Предложный</b> (о ком? где?) употребляется только с предлогами: w (в), na (на), o (о), przy (при, у), po (после).</p>
<table><tr><th>Окончание</th><th>Когда</th><th>Примеры</th></tr>
<tr><td>-e с чередованием</td><td>твёрдая основа (м., ж., ср.)</td><td>sklep → w sklepie, Warszawa → w Warszawie, biuro → w biurze, umowa → o umowie, Kraków → w Krakowie, Polska → w Polsce (k → c), miasto → w mieście</td></tr>
<tr><td>-u</td><td>м. и ср. на k, g, ch, j и мягкие</td><td>bank → w banku, dom → w domu, hotel → w hotelu, spotkanie → na spotkaniu</td></tr>
<tr><td>-i / -y</td><td>ж. на мягкую, -ja, -ia, шипящие</td><td>restauracja → w restauracji, praca → w pracy, sprzedaż → o sprzedaży</td></tr></table>
<ul>
<li>w или na? Обычно w (w biurze, w Polsce, w Warszawie), но na — с событиями и «поверхностями»: na spotkaniu, na stronie, na uczelni, na poczcie, на Украине — na Ukrainie.</li>
<li>Не путать: zadowolony <b>z</b> + родительный (z pracy, z umowy) — не творительный, как в русском «доволен работой».</li>
<li>Направление (куда?) — do + родительный (do biura), место (где?) — w + предложный (w biurze).</li>
</ul>`,
words:[["инженер","inżynier"],["директор по продажам","dyrektor sprzedaży"],["продажа","sprzedaż"],["украинец / украинка","Ukrainiec / Ukrainka"],["машина","samochód"],["поезд","pociąg"],["с (кем? чем?)","z (+ твор. п.)"],["Польша","Polska"],["город","miasto"],["интересоваться","interesować się"],["довольный","zadowolony"],["сайт, страница","strona"],["информация","informacja"],["ресторан","restauracja"],["банк","bank"],["коллега (ж.)","koleżanka"],["о (чём?)","o (+ предл. п.)"]],
s:[
{ru:"Я инженер.",pl:"Jestem inżynierem.",acc:["[Ja] jestem inżynierem"],d:["inżynier","jest","inżyniera"],note:"Профессия или статус после być — творительный падеж: inżynier → inżynierem (-em). «Я инженер» = Jestem inżynierem, никогда «Jestem inżynier»."},
{ru:"Он директор по продажам.",pl:"Jest dyrektorem sprzedaży.",acc:["[On] jest dyrektorem sprzedaży"],d:["dyrektor","jestem","sprzedaż"],note:"dyrektor → dyrektorem; sprzedaży — родительный от sprzedaż (директор чего? продаж). Творительный получает только главное слово."},
{ru:"Она украинка.",pl:"Jest Ukrainką.",acc:["[Ona] jest Ukrainką"],d:["Ukrainka","Ukrainiec","jestem"],note:"Женский род в творительном: -a → -ą: Ukrainka → Ukrainką. Национальности пишутся с большой буквы (при проверке регистр не важен). Мужчина: Jestem Ukraińcem."},
{ru:"Я еду на машине.",pl:"Jadę samochodem.",acc:["[Ja] jadę samochodem"],d:["samochód","jedzie","samochodu"],note:"Средство передвижения — творительный без предлога: samochodem, pociągiem, autobusem, tramwajem. samochód → samochodem (ó → o)."},
{ru:"Мы разговариваем с шефом о договоре.",pl:"Rozmawiamy z szefem o umowie.",acc:["[My] rozmawiamy z szefem o umowie"],d:["szef","umową","umowy"],note:"z + творительный: szef → z szefem; o + предложный: umowa → o umowie. Два падежа в одной фразе — типичная деловая конструкция."},
{ru:"Я живу в Польше.",pl:"Mieszkam w Polsce.",acc:["[Ja] mieszkam w Polsce"],d:["Polska","Polskę","mieszkasz"],note:"Предложный после w: Polska → w Polsce (k → c!). Аналогично: Warszawa → w Warszawie; но Ukraina → na Ukrainie (с na)."},
{ru:"Ты интересуешься продажами?",pl:"Interesujesz się sprzedażą?",acc:["[Czy] [ty] interesujesz się sprzedażą"],d:["sprzedaż","interesuję","sprzedaży"],note:"interesować się + творительный: sprzedaż → sprzedażą (женский род на согласный: + -ą). Не забудьте się."},
{ru:"Встреча в ресторане.",pl:"Spotkanie jest w restauracji.",acc:["Spotkanie [jest] w restauracji"],d:["restauracja","restaurację","są"],note:"restauracja → w restauracji: у существительных на -ja, -ia предложный на -i. Ср. w kawiarni, w Hiszpanii. Связка jest сохраняется."},
{ru:"Информация на сайте.",pl:"Informacja jest na stronie.",acc:["Informacja [jest] na stronie"],d:["strona","stronę","stroną"],note:"na + предложный (где?): strona → na stronie. Ср. na spotkaniu, na Ukrainie, na uczelni."},
{ru:"Я (м.) доволен работой.",pl:"Jestem zadowolony z pracy.",acc:["[Ja] jestem zadowolony z pracy"],d:["zadowolona","pracą","praca"],note:"zadowolony z + родительный (а не творительный!): z pracy, z umowy. Женщина скажет zadowolona. Русское «доволен чем» здесь не работает."},
{ru:"Мы в банке.",pl:"Jesteśmy w banku.",acc:["[My] jesteśmy w banku"],d:["bank","banka","jestem"],note:"Мужской род в предложном обычно -e с чередованием (sklep → w sklepie, Kraków → w Krakowie), но после k, g, ch, j и мягких согласных — -u: w banku, w domu, w hotelu, w kraju."},
{ru:"Она едет с коллегой (ж.) на поезде.",pl:"Jedzie z koleżanką pociągiem.",acc:["[Ona] jedzie {z koleżanką pociągiem|pociągiem z koleżanką}"],d:["koleżanka","kolegą","pociąg"],note:"koleżanka → z koleżanką (-ą); pociąg → pociągiem (после k, g творительный -iem). Коллега-мужчина: kolega → z kolegą."}
]});

LESSONS.push({
n:12, title:"Притяжательные и вежливые Pan / Pani / Państwo", sub:"moja wizytówka, Pana numer, Dziękuję Państwu",
rule:`<p>Притяжательные местоимения согласуются с существительным в роде и числе. Только jego, jej, ich не изменяются никогда.</p>
<table><tr><th></th><th>м.</th><th>ж.</th><th>ср.</th><th>мн. (мужчины)</th><th>мн. (остальные)</th></tr>
<tr><th>мой</th><td>mój</td><td>moja</td><td>moje</td><td>moi</td><td>moje</td></tr>
<tr><th>твой</th><td>twój</td><td>twoja</td><td>twoje</td><td>twoi</td><td>twoje</td></tr>
<tr><th>наш</th><td>nasz</td><td>nasza</td><td>nasze</td><td>nasi</td><td>nasze</td></tr>
<tr><th>ваш (на ты, мн.)</th><td>wasz</td><td>wasza</td><td>wasze</td><td>wasi</td><td>wasze</td></tr>
<tr><th>его / её / их</th><td colspan="5">jego / jej / ich — не изменяются</td></tr>
<tr><th>ваш (вежливо)</th><td colspan="5">Pana (к мужчине) / Pani (к женщине) / Państwa (к группе) — не изменяются</td></tr></table>
<p>Вежливое «вы» — это существительное в 3-м лице: <b>Pan</b> (к мужчине), <b>Pani</b> (к женщине), <b>Państwo</b> (к группе, в т. ч. к супругам), а также Panowie (к нескольким мужчинам) и Panie (к нескольким женщинам). Глагол — как при «он / она» или «они»: Pan ma, Pani była, Państwo mają, Państwo byli.</p>
<table><tr><th></th><th>к мужчине</th><th>к женщине</th><th>к группе</th></tr>
<tr><th>кто? (им.)</th><td>Pan</td><td>Pani</td><td>Państwo</td></tr>
<tr><th>кого? чей? (род.)</th><td>Pana</td><td>Pani</td><td>Państwa</td></tr>
<tr><th>кому? (дат.)</th><td>Panu</td><td>Pani</td><td>Państwu</td></tr>
<tr><th>кого? (вин.)</th><td>Pana</td><td>Panią</td><td>Państwa</td></tr>
<tr><th>с кем? (твор.)</th><td>z Panem</td><td>z Panią</td><td>z Państwem</td></tr>
<tr><th>о ком? (предл.)</th><td>o Panu</td><td>o Pani</td><td>o Państwu</td></tr>
<tr><th>обращение</th><td>Panie Kowalski!</td><td>Pani Anno!</td><td>Proszę Państwa!</td></tr></table>
<ul>
<li>К клиенту, партнёру, чиновнику, незнакомому — только Pan / Pani. На «ты» переходят по предложению старшего или по взаимной договорённости.</li>
<li>Формулы: Dzień dobry. Miło mi Pana / Panią poznać (рад познакомиться). Dziękuję Panu / Pani / Państwu. Przepraszam Panią (извините). Proszę Pana / Proszę Pani (обращение, чтобы привлечь внимание).</li>
<li>В письмах Pan, Pani, Państwo и притяжательные Pana, Pani, Państwa пишутся с большой буквы.</li>

rule:`<p>Деловой звонок по-польски держится на трёх вещах: Pan / Pani, условное наклонение и несколько формул. Всё остальное — лексика.</p>

<tr><td>Следующий шаг</td><td>Prześlę ofertę mailem. / Odezwę się w przyszłym tygodniu. / Potwierdzę termin jutro.</td></tr>

      if(nx){var fo=firstObs(nx);if(fo==='voiceless')nextV='voiceless';else if(fo==='voiced'||fo==='weak')nextV='none';else nextV=isPrep?'none':'voiceless';}

    }).join(' ');

  /* Словарная запись: части через « / », пояснения в скобках отбрасываются */
  function entry(s){

(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var PUNCT=/[.,!?;:"'«»„“”()\[\]{}\-–—…\/]/g;
var KEEP=/^(Pan|Pani|Panie|Państwo|Państwa|Państwu|Pana|Panu|Panią|Panem|Warszaw[\wąćęłńóśźż]*|Polsk[\wąćęłńóśźż]*|Polsce|Krak[\wąćęłńóśźż]*|Ukrain[\wąćęłńóśźż]*|Kowalski|PESEL|Solaris)$/;
var DIA={'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z'};
var DIACHARS=['ą','ć','ę','ł','ń','ó','ś','ź','ż'];
var DAY=86400000, INTERVALS=[0,1,3,7,14,30];

function norm(s){return String(s).toLowerCase().replace(PUNCT,' ').replace(/\s+/g,' ').trim();}
function strip(s){return s.replace(/[ąćęłńóśźż]/g,function(c){return DIA[c];});}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function expand(s){
  var i=0;
  while(i<s.length&&s[i]!=='['&&s[i]!=='{')i++;
  if(i===s.length)return [s];
  var open=s[i],depth=0,j=i;
  for(;j<s.length;j++){
    if(s[j]==='['||s[j]==='{')depth++;
    else if(s[j]===']'||s[j]==='}'){depth--;if(depth===0)break;}
  }
  var before=s.slice(0,i),inner=s.slice(i+1,j),after=s.slice(j+1);
  var innerOpts;
  if(open==='['){innerOpts=[''].concat(expand(inner));}
  else{
    var parts=[],d=0,last=0;
    for(var k=0;k<inner.length;k++){
      var c=inner[k];
      if(c==='['||c==='{')d++;
      else if(c===']'||c==='}')d--;
      else if(c==='|'&&d===0){parts.push(inner.slice(last,k));last=k+1;}
    }
    parts.push(inner.slice(last));
    innerOpts=[];
    parts.forEach(function(p){innerOpts=innerOpts.concat(expand(p));});
  }
  var afters=expand(after),out=[];
  innerOpts.forEach(function(o){afters.forEach(function(a){out.push(before+o+a);});});
  return out;
}

/* ===== Пословный разбор ошибки ===== */
function tokSim(a,b){
  if(a===b)return 0;
  if(strip(a)===strip(b))return 0.3;
  var k=0;while(k<a.length&&k<b.length&&a[k]===b[k])k++;
  if(k>=3||(k>=2&&Math.min(a.length,b.length)<=3))return 0.6;
  return 1;
}
function diffTokens(u,r){
  var n=u.length,m=r.length,D=[],B=[];
  for(var i=0;i<=n;i++){D[i]=[];B[i]=[];for(var j=0;j<=m;j++){D[i][j]=0;B[i][j]=null;}}
  for(var a=1;a<=n;a++){D[a][0]=a;B[a][0]='del';}
  for(var b=1;b<=m;b++){D[0][b]=b;B[0][b]='ins';}
  for(var x=1;x<=n;x++)for(var y=1;y<=m;y++){
    var sub=D[x-1][y-1]+tokSim(u[x-1],r[y-1]),del=D[x-1][y]+1,ins=D[x][y-1]+1;
    if(sub<=del&&sub<=ins){D[x][y]=sub;B[x][y]='sub';}else if(del<=ins){D[x][y]=del;B[x][y]='del';}else{D[x][y]=ins;B[x][y]='ins';}
  }
  var ops=[],p=n,q=m;
  while(p>0||q>0){
    var op=B[p][q];
    if(op==='sub'){ops.unshift({op:u[p-1]===r[q-1]?'eq':'sub',u:u[p-1],r:r[q-1]});p--;q--;}
    else if(op==='del'){ops.unshift({op:'del',u:u[p-1]});p--;}
    else{ops.unshift({op:'ins',r:r[q-1]});q--;}
  }
  return {cost:D[n][m],ops:ops};
}
function bestDiff(userN,S){
  var u=userN.split(' ').filter(Boolean),best=null;
  S._accList.forEach(function(v){var d=diffTokens(u,v.split(' '));if(!best||d.cost<best.cost)best={cost:d.cost,ops:d.ops,v:v};});
  return best;
}
function diffHTML(d){
  var parts=[],subs=[],miss=[],extra=[];
  d.ops.forEach(function(o){
    if(o.op==='eq')parts.push(esc(o.u));
    else if(o.op==='sub'){parts.push('<s>'+esc(o.u)+'</s> <b>'+esc(o.r)+'</b>');subs.push(o);}
    else if(o.op==='del'){parts.push('<s>'+esc(o.u)+'</s>');extra.push(o.u);}
    else{parts.push('<b>+'+esc(o.r)+'</b>');miss.push(o.r);}
  });
  var hint='';
  var uSorted=d.ops.filter(function(o){return o.op!=='ins';}).map(function(o){return o.u;}).sort().join(' ');
  var rSorted=d.v.split(' ').sort().join(' ');
  if(!subs.length&&!miss.length&&!extra.length)hint='';
  else if(uSorted===rSorted)hint='Все слова верные, но такой порядок не принимается.';
  else if(subs.length===1&&!miss.length&&!extra.length)hint='Ошибка в одном слове: '+subs[0].u+' → '+subs[0].r+(strip(subs[0].u)===strip(subs[0].r)?' (только знак)':'')+'.';
  else if(!subs.length&&miss.length&&!extra.length)hint='Пропущено: '+miss.join(', ')+'.';
  else if(!subs.length&&!miss.length&&extra.length)hint='Лишнее: '+extra.join(', ')+'.';
  else{var bits=[];if(subs.length)bits.push('неверно: '+subs.map(function(o){return o.u+' → '+o.r;}).join(', '));if(miss.length)bits.push('пропущено: '+miss.join(', '));if(extra.length)bits.push('лишнее: '+extra.join(', '));hint=bits.join('; ')+'.';}
  return '<div class="diff"><div class="difflabel">Разбор ответа</div><span class="pl">'+parts.join(' ')+'</span>'+(hint?'<div class="diffhint">'+esc(hint)+'</div>':'')+'</div>';
}

/* ===== Проверка ===== */
function recordResult(S,st,firstInSession){
  var s=sentStat(S._key),ok=st!=='r';
  s.a++;if(ok)s.c++;else s.w++;
  if(firstInSession){
    s.fa++;if(ok)s.fc++;
    s.lf=st;
    if(ok){s.box=Math.min((s.box||0)+1,5);s.due=Date.now()+INTERVALS[s.box]*DAY;}
    else{s.box=0;s.due=Date.now();}
  }else if(!ok){s.box=0;s.due=Date.now();}
}
function check(){
  var ps=PS();
  if(ps.checked||!ps.queue.length)return;
  var inp=$('#ans'),n=norm(inp.value);
  if(!n){inp.focus();return;}
  var idx=ps.queue[0],S=itemSentence(ps.items[idx]),st,matched=null;
  if(S._acc[n])st='g';
  else{var k=strip(n);if(S._str[k]){st='y';matched=S._str[k];}else st='r';}
  ps.attempts++;
  var firstInSession=ps.first[idx]===null;
  if(st==='r'){ps.wrong++;ps.queue.push(ps.queue.shift());}
  else{ps.correct++;ps.solved[idx]=true;ps.queue.shift();}
  if(firstInSession)ps.first[idx]=st;
  ps.checked={st:st,idx:idx,matched:matched,user:n};
  ps.gridFor=-1;
  recordResult(S,st,firstInSession);
  if(!ps.queue.length&&ps.kind==='lesson'){
    var lp=progress.lessons[L().id]||(progress.lessons[L().id]={passes:0,last:null,best:null,date:0});
    var g=5*ps.correct/ps.attempts;
    lp.passes++;lp.last=g;lp.best=(lp.best==null)?g:Math.max(lp.best,g);lp.date=Date.now();
  }
  saveStore();
  updateScoreBar();
  showFeedback(S,ps.checked);
}
function highlightDia(target,user){

}
function showFeedback(S,c){

/* ===== Режим «Слова» ===== */
function makeOpts(ws,cur){
  var words=L().words,others=[],seen={};
  seen[words[cur][1]]=true;
  words.forEach(function(w,i){if(i!==cur&&!seen[w[1]]){seen[w[1]]=true;others.push(i);}});
  shuffle(others);
  ws.opts=shuffle([cur].concat(others.slice(0,5)));ws.optsFor=cur;
}
function renderWords(){
  var l=L(),ws=WS(),panel=$('#panel');

      '<div class="actions"><button type="button" class="primary" id="btnWRestart">Ещё раз</button><button type="button" class="secondary" id="btnToPhrases">Фразы раздела</button></div></div>';

  h+='<div class="opts">'+ws.opts.map(function(oi,k){

  }).join('')+'</div>';
  if(ws.fb){
    h+='<div class="wfb '+(ws.fb.ok?'ok':'bad')+'"><span>'+(ws.fb.ok?'Верно':'Неверно — слово вернётся позже')+'</span><button type="button" class="spk" data-say="'+esc(w[1].replace(/\s*\(.*?\)\s*/g,' ').replace(/\s*\/\s*/g,', ').trim()||w[1])+'" title="Озвучить" aria-label="Озвучить">🔊</button></div>';

function pick(k){
  var ws=WS();

function tagStats(){
  var acc={};
  LESSONS.forEach(function(L){L.s.forEach(function(S){var s=progress.sent[S._key];if(!s||!s.fa)return;S._tags.forEach(function(t){var a=acc[t]||(acc[t]={fa:0,fc:0,n:0});a.fa+=s.fa;a.fc+=s.fc;a.n++;});});});
  return Object.keys(acc).map(function(t){return {tag:t,label:TAGS[t]||t,fa:acc[t].fa,fc:acc[t].fc,n:acc[t].n,rate:acc[t].fc/acc[t].fa};});
}
function tagRowHTML(t){var pct=Math.round(100*t.rate);return '<div class="tagrow"><div class="tagname">'+esc(t.label)+'<span class="muted"> · '+t.fa+' попыт.</span></div><div class="tagbar"><i style="width:'+pct+'%" class="'+(pct<60?'r':pct<85?'y':'g')+'"></i></div><div class="tagpct">'+pct+'%</div></div>';}

     '<div class="sumfacts"><div>Пройдено разделов: <b>'+passed.length+' из '+LESSONS.length+'</b></div><div>Точность с первой попытки: <b>'+(fa?Math.round(100*fc/fa)+'%':'–')+'</b> <span class="muted">('+fc+' из '+fa+')</span></div></div></div>';
