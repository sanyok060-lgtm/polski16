name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci

      - name: Add Android platform (if not already in the repo)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Apply permanent signing key to debug & release builds
        run: |
          MARKER="POLSKI16_SIGNING_CONFIG"
          GRADLE_FILE="android/app/build.gradle"
          if ! grep -q "$MARKER" "$GRADLE_FILE"; then
            cat >> "$GRADLE_FILE" << 'GRADLE_EOF'

          // ---- POLSKI16_SIGNING_CONFIG ----
          // Added automatically by the android.yml workflow so debug and release
          // builds always use the same permanent key (android-signing/polski16.jks).
          // Do not remove this block; see README.md for the keystore passwords.
          android {
              signingConfigs {
                  polski16 {
                      storeFile rootProject.file("../android-signing/polski16.jks")
                      storePassword "QT3hAuzONEen9uWCy88R"
                      keyAlias "polski16"
                      keyPassword "QT3hAuzONEen9uWCy88R"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.polski16
                  }
                  release {
                      signingConfig signingConfigs.polski16
                  }
              }
          }
          GRADLE_EOF
          fi

      - name: Sync web assets into the native project
        run: npx cap sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: polski16-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
